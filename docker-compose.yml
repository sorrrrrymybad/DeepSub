services:
  redis:
    image: redis:latest
    restart: unless-stopped
    volumes:
      - redis_data:/data

  app:
    build: .
    image: deepsub:latest
    restart: unless-stopped
    stdin_open: true
    tty: true
    env_file: .env
    ports:
      - "${FRONTEND_PORT:-80}:80"
    # 宿主端口由 .env 中 FRONTEND_PORT 决定；容器内 nginx 始终监听 80
    volumes:
      - ./data:/app/data
      - /volume2/media:/media
    depends_on:
      - redis

volumes:
  redis_data:
